<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FAF6EE" />
<title>Programa de Lealtad</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FAF6EE;
    --ink: #1A1A1A;
    --ink-soft: #4A4A4A;
    --ink-mute: #8B8579;
    --accent: #1F5E3F;
    --accent-soft: #E8EFE9;
    --line: #E5DFCF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* subtle paper grain */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(0,0,0,0.025) 1px, transparent 0);
    background-size: 24px 24px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin: 0 auto;
    padding: max(2.5rem, env(safe-area-inset-top)) 1.75rem max(2rem, env(safe-area-inset-bottom));
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    opacity: 0;
    animation: fadeIn 0.6s ease 0.1s forwards;
  }

  .label {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--ink-mute);
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.35rem 0.7rem;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 100px;
    font-size: 0.65rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .pill .dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 3rem 0;
  }

  .check-wrap {
    margin-bottom: 2.5rem;
    opacity: 0;
    animation: fadeIn 0.5s ease 0.3s forwards;
  }

  .check {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .check svg {
    width: 26px;
    height: 26px;
    stroke-dasharray: 30;
    stroke-dashoffset: 30;
    animation: drawCheck 0.6s ease 0.7s forwards;
  }

  .greeting {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(2.5rem, 9vw, 3.75rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 1.25rem;
    opacity: 0;
    animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards;
  }

  .greeting .name {
    font-style: italic;
    font-weight: 500;
  }

  .message {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-size: 1.05rem;
    line-height: 1.55;
    color: var(--ink-soft);
    max-width: 380px;
    opacity: 0;
    animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
  }

  .visit-card {
    margin-top: 3rem;
    padding: 1.5rem;
    background: white;
    border: 1px solid var(--line);
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    opacity: 0;
    animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.75s forwards;
  }

  .visit-card .meta {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .visit-card .meta .label {
    font-size: 0.65rem;
  }

  .visit-card .date {
    font-family: 'Fraunces', serif;
    font-size: 0.95rem;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  .visit-number {
    text-align: right;
  }

  .visit-number .num {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 2.5rem;
    line-height: 1;
    letter-spacing: -0.04em;
    color: var(--accent);
  }

  .visit-number .label {
    font-size: 0.6rem;
    margin-top: 0.3rem;
  }

  footer {
    margin-top: auto;
    padding-top: 2rem;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.65rem;
    color: var(--ink-mute);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    opacity: 0;
    animation: fadeIn 0.6s ease 0.9s forwards;
  }

  footer .nfc-icon {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }

  footer svg {
    width: 14px;
    height: 14px;
    opacity: 0.6;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }

  @keyframes drawCheck {
    to { stroke-dashoffset: 0; }
  }

  @media (max-width: 380px) {
    .visit-card { flex-direction: column; align-items: flex-start; gap: 1.25rem; }
    .visit-number { text-align: left; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <span class="label">Programa de Lealtad</span>
    <span class="pill"><span class="dot"></span>Registrada</span>
  </header>

  <main>
    <div class="check-wrap">
      <div class="check">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
    </div>

    <h1 class="greeting">
      Hola, <span class="name" id="nombre">Visitante</span>.
    </h1>

    <p class="message">
      Gracias por registrar tu visita. Tu fidelidad significa todo para nosotros.
    </p>

    <div class="visit-card">
      <div class="meta">
        <span class="label">Visita registrada</span>
        <span class="date" id="fecha">—</span>
      </div>
      <div class="visit-number">
        <div class="num" id="contador">01</div>
        <span class="label">Visitas</span>
      </div>
    </div>
  </main>

  <footer>
    <span class="nfc-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12c0-4 4-8 8-8s8 4 8 8-4 8-8 8"></path>
        <path d="M8 12c0-2 2-4 4-4s4 2 4 4-2 4-4 4"></path>
        <circle cx="12" cy="12" r="1"></circle>
      </svg>
      Escaneado vía NFC
    </span>
    <span id="hora">—</span>
  </footer>

</div>

<script>
  // 1. Nombre desde URL (?nombre=Edwin+Vargas)
  const params = new URLSearchParams(window.location.search);
  const nombre = params.get('nombre') || 'Visitante';
  document.getElementById('nombre').textContent = nombre;

  // 2. Fecha y hora en español
  const ahora = new Date();
  const fechaFmt = ahora.toLocaleDateString('es-MX', {
    day: 'numeric', month: 'long', year: 'numeric'
  });
  const horaFmt = ahora.toLocaleTimeString('es-MX', {
    hour: '2-digit', minute: '2-digit'
  });
  document.getElementById('fecha').textContent = fechaFmt;
  document.getElementById('hora').textContent = horaFmt;

  // 3. Contador de visitas (localStorage, por nombre)
  const key = `visitas_${nombre}`;
  const visitas = parseInt(localStorage.getItem(key) || '0') + 1;
  localStorage.setItem(key, visitas);
  document.getElementById('contador').textContent = String(visitas).padStart(2, '0');
</script>
</body>
</html>
